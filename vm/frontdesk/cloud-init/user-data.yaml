#cloud-config
# First-boot configuration for the "frontdesk" half of the Master
# (Two Offices) CTF box. Native build -- no Docker. This file only
# establishes accounts, packages, and SSH policy; vm/scripts/
# remote-provision-frontdesk.sh (run over SSH) deploys the challenge.

hostname: frontdesk
manage_etc_hosts: true

users:
  - name: ctfbuilder
    gecos: "CTF build/maintenance account (instructor-only, key-based)"
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKdkeCYqlhw6ffAJVjsY6IiGXJ9uiz0ZJUP6zw63aUZx ctf-instructor-build-key"

chpasswd:
  expire: false

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: false
packages:
  - python3
  - python3-venv
  - python3-pip
  - openssh-server
  - cron
  - sudo
  - libxml2-dev
  - libxslt1-dev
  - curl

runcmd:
  - [bash, -c, "echo 'cloud-init base config applied' > /var/log/ctf-cloudinit.log"]
