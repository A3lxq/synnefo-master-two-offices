[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true

[program:cron]
command=/usr/sbin/cron -f
autorestart=true

[program:app]
command=/opt/venv/bin/python3 /opt/app/app.py
directory=/opt/app
environment=CTF_SECRET="%(ENV_CTF_SECRET)s"
autorestart=true
