services:
  frontdesk:
    build:
      context: .
      dockerfile: docker/frontdesk/Dockerfile
    container_name: halcyon-master-frontdesk
    environment:
      - CTF_SECRET=${CTF_SECRET}
    ports:
      - "8004:5000"
      - "2204:22"
    networks:
      - public-net
      - internal-net

  backoffice:
    build:
      context: .
      dockerfile: docker/backoffice/Dockerfile
    container_name: halcyon-master-backoffice
    environment:
      - CTF_SECRET=${CTF_SECRET}
    # Intentionally NO "ports:" here -- backoffice is reachable only
    # from frontdesk, over internal-net. Never exposed to the host.
    networks:
      - internal-net

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
